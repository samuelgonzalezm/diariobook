<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migrador de Datos — Omniapp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-2xl space-y-5">
        
        <div class="text-center">
            <div class="text-4xl mb-2">🔄</div>
            <h1 class="text-2xl font-black text-indigo-600">Migrador de Datos</h1>
            <p class="text-xs text-slate-500 mt-1">Omniapp — Mueve tus datos del userKey viejo al nuevo</p>
        </div>

        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 leading-relaxed">
            <strong>⚠️ Importante:</strong> Usa este script solo si después de migrar al nuevo sistema de hash <strong>tus datos desaparecieron</strong>. El script copia todo del path viejo al nuevo sin borrar nada.
        </div>

        <!-- FORMULARIO -->
        <form id="migrateForm" class="space-y-3" onsubmit="event.preventDefault(); runMigration();">
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">N° DE REGISTRO (8 dígitos)</label>
                <input type="text" id="regInput" maxlength="8" pattern="\d{8}" required placeholder="Ej: 16112001" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">CLAVE (la que usabas antes)</label>
                <input type="password" id="passInput" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold outline-none focus:border-indigo-500">
            </div>
            <button type="submit" id="migrateBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold rounded-xl shadow uppercase text-xs tracking-wider transition">
                🔄 Migrar mis datos
            </button>
        </form>

        <!-- LOG / RESULTADO -->
        <div id="logBox" class="hidden bg-slate-900 text-slate-100 rounded-xl p-4 text-xs font-mono space-y-1 max-h-64 overflow-y-auto"></div>

    </div>

    <script>
        // ⚠️ MISMO firebaseConfig que tu index.html
        const firebaseConfig = {
            apiKey: "AIzaSyDyqGCGO0hKrrFv091SkfOYZmG2UGDgXJ0",
            authDomain: "condoapp-d1729.firebaseapp.com",
            databaseURL: "https://condoapp-d1729-default-rtdb.firebaseio.com",
            projectId: "condoapp-d1729",
            storageBucket: "condoapp-d1729.firebasestorage.app",
            messagingSenderId: "834784357986",
            appId: "1:834784357986:web:90855a08e0c5399d8aeb3b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ---- MISMAS funciones que tu index.html (para consistencia) ----
        const FIREBASE_FORBIDDEN_CHARS = /[.#$\[\]\/\u0000-\u001F\u007F]/g;

        function sanitizeForKey(str) {
            if (str == null) return '';
            return String(str).replace(FIREBASE_FORBIDDEN_CHARS, '_');
        }

        function isValidRegNumber(reg) {
            return /^\d{8}$/.test(reg);
        }

        function isValidPassKey(pass) {
            return /^[a-z0-9]{4,}$/.test(pass);
        }

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ---- LOG ----
        function log(msg, color = 'slate-100') {
            const box = document.getElementById('logBox');
            box.classList.remove('hidden');
            const line = document.createElement('div');
            line.className = `text-${color}`;
            line.textContent = msg;
            box.appendChild(line);
            box.scrollTop = box.scrollHeight;
        }

        // ---- MIGRACIÓN ----
        async function runMigration() {
            const reg = document.getElementById('regInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();

            if (!isValidRegNumber(reg)) {
                return alert('El número de registro debe tener 8 dígitos.');
            }
            if (!isValidPassKey(pass)) {
                return alert('La clave debe tener solo letras minúsculas y números (mínimo 4 caracteres).');
            }

            // Deshabilitar botón mientras se ejecuta
            const btn = document.getElementById('migrateBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Migrando...';

            document.getElementById('logBox').innerHTML = '';
            log('🚀 Iniciando migración...', 'yellow-400');

            try {
                // 1. Verificar que el usuario existe
                const userSnap = await db.ref(`users/${reg}`).once('value');
                const userVal = userSnap.val();

                if (!userVal) {
                    log(`❌ No existe el usuario con reg ${reg}`, 'red-400');
                    return resetBtn();
                }

                // 2. Calcular ambos userKeys
                const safeReg = sanitizeForKey(reg);

                // userKey viejo (con clave en texto plano)
                const oldKey = `user_${safeReg}_${sanitizeForKey(pass)}`;

                // userKey nuevo (con hash)
                const passHash = await hashPassword(pass);
                const newKey = `user_${safeReg}_${sanitizeForKey(passHash).substring(0, 24)}`;

                log(`📌 userKey viejo: ${oldKey}`, 'blue-300');
                log(`📌 userKey nuevo: ${newKey}`, 'blue-300');

                if (oldKey === newKey) {
                    log('ℹ️ Los keys son iguales. No hay nada que migrar.', 'yellow-400');
                    return resetBtn();
                }

                // 3. Verificar que el path viejo tiene datos
                const oldDataSnap = await db.ref(oldKey).once('value');
                const oldData = oldDataSnap.val();

                if (!oldData) {
                    log('⚠️ No hay datos en el path viejo. Nada que migrar.', 'yellow-400');
                    return resetBtn();
                }

                // 4. Verificar qué contiene
                const sections = ['tasks', 'timeblocks', 'pills', 'migraines', 'notes', 'stores'];
                const summary = {};
                sections.forEach(s => {
                    if (oldData[s]) {
                        const count = Array.isArray(oldData[s]) ? oldData[s].length : Object.keys(oldData[s]).length;
                        summary[s] = count;
                    }
                });

                log('📦 Datos encontrados en el path viejo:', 'green-400');
                Object.keys(summary).forEach(k => {
                    log(`   • ${k}: ${summary[k]} elemento(s)`, 'green-300');
                });

                // 5. Verificar si el nuevo path ya tiene datos
                const newDataSnap = await db.ref(newKey).once('value');
                const newData = newDataSnap.val();

                if (newData && Object.keys(newData).length > 0) {
                    const confirmMsg = '⚠️ El path NUEVO ya tiene datos.\n\n' +
                        'Si continúas, se SOBRESCRIBIRÁN con los del path viejo.\n\n' +
                        '¿Estás seguro?';
                    if (!confirm(confirmMsg)) {
                        log('❌ Migración cancelada por el usuario.', 'red-400');
                        return resetBtn();
                    }
                }

                // 6. Copiar datos
                log('📤 Copiando datos al path nuevo...', 'yellow-400');

                for (const section of sections) {
                    if (!oldData[section]) continue;
                    
                    try {
                        await db.ref(`${newKey}/${section}`).set(oldData[section]);
                        log(`   ✅ ${section} migrado`, 'green-300');
                    } catch (err) {
                        log(`   ❌ Error en ${section}: ${err.message}`, 'red-400');
                    }
                }

                // 7. NO borrar el path viejo (seguridad)
                log('🔒 Datos del path viejo se mantienen intactos por seguridad.', 'slate-400');
                log('✅ ¡Migración completa!', 'green-400');
                log('👉 Ahora ve a la app y recarga para ver tus datos.', 'cyan-400');

                alert('✅ Migración completa. Recarga la app para ver tus datos.');

            } catch (err) {
                log(`❌ Error inesperado: ${err.message}`, 'red-400');
                console.error(err);
            }

            resetBtn();
        }

        function resetBtn() {
            const btn = document.getElementById('migrateBtn');
            btn.disabled = false;
            btn.textContent = '🔄 Migrar mis datos';
        }
    </script>

</body>
</html>
